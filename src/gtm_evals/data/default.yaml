# gtm-evals default policy. Override any key in your own gtm-evals.yaml; lists are replaced, not merged.
version: 1

claims:
  stamps: ["OBSERVED", "OUR READ", "ASSUMED · ±1", "ASSUMED", "CAPTURED"]
  stamp_window_chars: 120          # a ₹ figure needs a stamp within this many characters
  assumed_requires_range: true     # ASSUMED ₹ figures must be ranges (₹X–Y), never points
  ignore_years: [1990, 2035]       # 4-digit numbers in this range are treated as years
  ignore_numbers: ["1", "2", "3", "30", "60", "90"]   # step counts / Day 30/60/90 references
  block_number_words: true
  number_words: ["hundred", "thousand", "lakh", "lakhs", "crore", "million", "dozen", "twice", "double", "triple", "half of"]

promise:
  # Phrases that are only true if results go well. Case-insensitive regex.
  banned:
    - "\\bguarantee(d|s)?\\b"
    - "\\b(get|be|getting) (you )?cited (in|within) \\d+"
    - "\\brank(ed|ing)? (#|no\\.? ?|number )?1\\b"
    - "\\b(top|first) (spot|position|result) (on|in) (chatgpt|perplexity|gemini|google|ai)"
    - "\\b(will|we'll|we will) (double|triple|10x|increase|grow|boost) (your )?(revenue|sales|leads|roas)"
    - "\\b100% (accurate|visibility|results)\\b"
    - "\\bovernight\\b"
    - "\\b(will|we'll|we will)\\s+\\d+\\s?x\\b"
    - "#\\s?1\\b(\\s+(spot|position|rank|result|answer))?(\\s+(on|in)\\s+(chatgpt|perplexity|gemini|google|ai))?"
    - "\\b(cited|recommended|ranked|mentioned|featured)\\s+(in|within)\\s+(a|one|two|three|four|six|\\d+)\\s+(day|week|month)s?\\b"
    - "\\b(the\\s+)?top\\s+(answer|result|recommendation|pick)\\s+(on|in)\\b"

outreach:
  max_words: 160
  signal_freshness_days: 45
  # results words a personal claim may only use if the signal itself says them
  outcome_words: ["doubl", "tripl", "sales", "revenue", "roas", "growth", "growing", "selling out", "sold out", "viral", "%"]
  require_unsubscribe_for: ["email"]
  unsubscribe_patterns: ["unsubscribe", "opt out", "opt-out", "reply stop", "reply \"stop\""]
  optin_required_for: ["whatsapp", "sms"]
  private_metric_patterns:          # blocked before intake (stage < audit)
    - "\\byour (conversion rates?|cvr|cac|aov|roas|ltv|churn|margins?|repeat rate|return rate)\\b"
    - "\\byour (revenue|sales|orders)\\s+(is|are|of|at|must|looks?|seems?|could|might|'s)\\b"
    - "\\byou(?:'re| are) (losing|burning|spending) ₹?\\s?[\\d,]+ (on|in) (ads|cac)"
  stages_with_private_data: ["audit", "build", "retainer"]
  daily_cap_per_inbox: 30
  stop_bounce_rate: 0.02
  stop_spam_complaint_rate: 0.001
  sender_auth_required: ["spf", "dkim", "dmarc"]
  excluded_categories: []         # your ICP exclusions, e.g. ["trading", "real estate"]

automation:
  dedupe_window_hours: 24
  max_per_contact_per_7d: {email: 3, whatsapp: 2, sms: 1}
  quiet_hours_ist: {start: "21:00", end: "10:00"}   # promotional sends blocked; verify vs current TRAI rules
  promotional_types: ["promo", "winback", "abandoned_cart", "launch"]
  max_audience_growth_factor: 3.0
  reply_agent_allowed_actions: ["answer_faq", "share_link", "book_call", "escalate"]
  escalate_keywords: ["refund", "discount", "% off", "percent off", "money back", "chargeback", "paise wapas", "paisa wapas", "paise vapas",
                      "legal", "lawyer", "complaint", "consumer court", "allergy", "side effect", "reaction", "hospital"]
  # Allowlist: an inbound message may get an automatic reply ONLY if it matches one of these.
  # Everything else goes to a human. Safer than a keyword blocklist, which misses new phrasings.
  reply_auto_ok_patterns:
    - "\\bwhere (can|do) i (buy|get|find)\\b"
    - "\\bwhere is my order\\b"
    - "\\b(track|tracking)\\b"
    - "\\border status\\b"
    - "\\b(price|cost|how much)\\b"
    - "\\b(delivery|shipping) (time|charges?|date)\\b"
    - "\\bingredients?\\b"
    - "\\b(store|shop) (hours|timings?|location)\\b"
  offer_words: ["% off", "percent off", "discount", "coupon", "use code", "sale", "offer", "cashback"]

action_gate:
  tiers:
    R0: {checks: false, evaluator: false, human: false, canary: false}
    R1: {checks: true,  evaluator: false, human: false, canary: false}
    R2: {checks: true,  evaluator: true,  human: false, canary: false}
    R3: {checks: true,  evaluator: true,  human: true,  canary: true}
  action_tiers:
    draft: R0
    recon_note: R0
    crm_update: R1
    score_lead: R1
    report_draft: R1
    send_single: R2
    reply_single: R2
    send_bulk: R3
    activate_flow: R3
    publish: R3
    client_crm_bulk_write: R3
  kill_switch_env: "GTM_EVALS_KILL_SWITCH"
  max_regenerations: 2
  max_tokens_per_run: 200000

visibility:
  query_types: ["brand", "niche", "best_x"]
  min_runs_per_prompt: 2
  z: 1.96

evals:
  min_recall_must_block: 0.95
  min_precision: 0.80

manipulation:   # ethics: escalated for a human to verify, never auto-sent
  patterns:
    - "\\bonly \\d+ (left|spots?|slots?|seats?)\\b"
    - "\\b(last|final) chance\\b"
    - "\\b(ends|expires|closing) (tonight|today|in \\d+ (hours?|minutes?))\\b"
    - "\\b(everyone|all your competitors) (is|are) (already )?(using|doing)\\b"
    - "\\byou('ll| will) (regret|lose everything|be left behind)\\b"
    - "\\bact (now|fast)\\b"

deployment_gate:
  lanes:                     # guards every workflow in a lane must wire in
    content_ops:          [claims_gate, promise_guard, manipulation_guard]
    ai_visibility:        [visibility_stats]
    gtm_engineering:      [outreach_guard, promise_guard, pii_guard, injection_guard, manipulation_guard]
    marketing_automation: [automation_guard, pii_guard, injection_guard, manipulation_guard]
  min_real_golden_cases: 30  # needed before 'deployed'; fewer = pilot only
  judge_min_labels: 30
  judge_min_agreement: 0.85
  min_log_retention_days: 90
  # Never collected or stored by a workflow (DPDP minimisation; Clyve memory rules)
  forbidden_data_fields: [aadhaar, pan, passport, bank_account, card_number, religion, caste, health, sexual_orientation, political_view]
  # Never used to score, rank or target people (fairness)
  protected_attributes: [gender, age, religion, caste, ethnicity, race, disability, marital_status, sexual_orientation, pregnancy]
