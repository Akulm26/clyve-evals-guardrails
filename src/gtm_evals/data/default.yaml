# gtm-evals default policy. Override any key in your own gtm-evals.yaml; lists are replaced, not merged.
version: 1

claims:
  stamps: ["OBSERVED", "OUR READ", "ASSUMED · ±1", "ASSUMED", "CAPTURED"]
  stamp_window_chars: 120          # a ₹ figure needs a stamp within this many characters
  assumed_requires_range: true     # ASSUMED ₹ figures must be ranges (₹X–Y), never points
  ignore_years: [1990, 2035]       # 4-digit numbers in this range are treated as years
  ignore_numbers: ["1", "2", "3", "30", "60", "90"]   # step counts / Day 30/60/90 references
  block_number_words: true
  number_words: ["hundred", "thousand", "lakh", "lakhs", "crore", "million", "dozen", "twice", "double", "triple", "half of"]

promise:
  # Phrases that are only true if results go well. Case-insensitive regex.
  banned:
    - "\\bguarantee(d|s)?\\b"
    - "\\b(get|be|getting) (you )?cited (in|within) \\d+"
    - "\\brank(ed|ing)? (#|no\\.? ?|number )?1\\b"
    - "\\b(top|first) (spot|position|result) (on|in) (chatgpt|perplexity|gemini|google|ai)"
    - "\\b(will|we'll|we will) (double|triple|10x|increase|grow|boost) (your )?(revenue|sales|leads|roas)"
    - "\\b100% (accurate|visibility|results)\\b"
    - "\\bovernight\\b"
    - "\\b(will|we'll|we will)\\s+\\d+\\s?x\\b"
    - "#\\s?1\\b(\\s+(spot|position|rank|result|answer))?(\\s+(on|in)\\s+(chatgpt|perplexity|gemini|google|ai))?"
    - "\\b(cited|recommended|ranked|mentioned|featured)\\s+(in|within)\\s+(a|one|two|three|four|six|\\d+)\\s+(day|week|month)s?\\b"
    - "\\b(the\\s+)?top\\s+(answer|result|recommendation|pick)\\s+(on|in)\\b"

dpdp:   # DPDP Act 2023 + DPDP Rules 2025 (notified 13 Nov 2025). Not legal advice; duties phase in by date.
  adult_age: 18
  child_categories: [kids, kid, children, baby, infant, toddler, teen, school, toy, kids nutrition]
  behavioural_segment_patterns: ["brows", "viewed", "visited", "abandon", "lookalike", "retarget", "behaviou?r", "interest", "affinity"]
  require_consent_record: false    # turn on once the Rules' consent duties apply to you
  notice_must_cover:
    "what personal data is collected": ["(we|will) collect", "data we (collect|use)", "personal data", "information we collect", "your (name|email|phone|number)"]
    "why it is used": ["purpose", "to send you", "we use (it|this|your)", "in order to", "so that we can"]
    "how to withdraw consent": ["withdraw", "unsubscribe", "opt[ -]?out", "reply stop", "revoke"]
    "who to contact with a grievance": ["grievance", "contact (us|our)", "data protection officer", "dpo", "write to us", "@"]
    "that a complaint can go to the Data Protection Board": ["data protection board", "the board"]

trai:   # TRAI TCCCPR as amended Feb 2025 (PR 11/2025). Confirm against TRAI's current text before relying on it.
  channels: [sms, voice]
  dlt_channels: [sms]
  reconsent_lock_days: 90          # after an opt-out, no request to opt in again for 90 days
  transaction_consent_days: 7      # consent given during a transaction covers promotions for 7 days
  # Header suffix by category. Widely reported as -P / -S / -T / -G; one fetched TRAI text read differently: verify.
  header_suffix: {promotional: P, service: S, transactional: T, government: G}
  category_aliases: {transactional: transactional, service: service, otp: transactional, alert: service, reminder: service}

claim_safety:   # regulated categories (ContentOS quality gate). Not legal advice: review against current ASCI / FSSAI rules.
  regulated_categories: [food, beverage, spice, masala, snack, supplement, nutraceutical, health, wellness, ayurved, pharma,
                         personal care, skincare, skin care, cosmetic, haircare, hair care, baby, infant, kids nutrition]
  food_categories: [food, beverage, spice, masala, snack, supplement, nutraceutical, kids nutrition, tea, coffee, ghee, honey]
  prohibited_for_food:   # FSSAI advisory, 30 May 2025: no "100%" on labels or in promotional content
    - "\\b100\\s?%"
    - "\\b100\\s?per\\s?cent\\b"
  prohibited:     # can't be claimed for these products
    - "\\b(cures?|cured|curing|heals?|healing)\\b"
    - "\\b(treats?|prevents?|reverses?)\\s+(\\w+\\s+){0,2}(diabetes|cancer|covid|disease|illness|infection|blood pressure|bp|cholesterol|thyroid|pcos|arthritis)"
    - "\\b(anti[- ]?(cancer|diabetic|viral|bacterial))\\b"
    - "\\bno side[- ]effects?\\b"
    - "\\b(lose|burn)\\s+\\d+\\s?(kg|kilos?|pounds|lbs)\\b"
  needs_substantiation:   # allowed only with proof on file
    - "\\bclinically (proven|tested|shown)\\b"
    - "\\b(doctor|dermatologist|nutritionist)[- ](recommended|approved|tested)\\b"
    - "\\b(immunity|immune)[- ]?(boost(er|ing)?|support)\\b"
    - "\\b100% (natural|organic|pure)\\b"
    - "\\b(chemical|preservative|toxin)[- ]free\\b"
    - "\\b(sugar|gluten|dairy)[- ]free\\b"
    - "\\b(weight loss|fat burn(ing|er)?|detox)\\b"
    - "\\b(scientifically|lab) (proven|tested)\\b"
  comparative:    # any category: superlatives and comparisons need proof
    - "\\b(no\\.? ?1|number one|#1)\\b[^.!?]{0,30}\\b(in india|brand|in the country|seller|selling)\\b"
    - "\\b(india's|the country's|the world's) (best|first|only|largest|most trusted)\\b"
    - "\\bbest[- ]selling\\b"
    - "\\b(better|healthier|purer|tastier) than (other|any|all|regular|leading)\\b"

enrichment:   # GTM: data written to a CRM by an enrichment or research agent
  max_age_days: 180               # a fact older than this is re-checked, not written
  min_confidence: 0.7             # when the enrichment tool reports a confidence
  allowed_fields: []              # if set, only these fields may be written
  work_contact_only: true         # personal email domains and free-text phone numbers need consent
  personal_email_domains: [gmail.com, yahoo.com, yahoo.co.in, hotmail.com, outlook.com, rediffmail.com, icloud.com, proton.me]

outreach:
  max_words: 160
  signal_freshness_days: 45
  # results words a personal claim may only use if the signal itself says them
  outcome_words: ["doubl", "tripl", "sales", "revenue", "roas", "growth", "growing", "selling out", "sold out", "viral", "%"]
  require_unsubscribe_for: ["email"]
  # Gmail/Yahoo bulk-sender rules: one-click unsubscribe headers (RFC 8058) on marketing email.
  # "bulk" = when context["bulk_sender"] is true (Gmail: 5,000+ a day to Gmail, permanent once reached); "always"; "never".
  one_click_unsubscribe: bulk
  unsubscribe_patterns: ["unsubscribe", "opt out", "opt-out", "reply stop", "reply \"stop\""]
  optin_required_for: ["whatsapp", "sms"]
  private_metric_patterns:          # blocked before intake (stage < audit)
    - "\\byour (conversion rates?|cvr|cac|aov|roas|ltv|churn|margins?|repeat rate|return rate)\\b"
    - "\\byour (revenue|sales|orders)\\s+(is|are|of|at|must|looks?|seems?|could|might|'s)\\b"
    - "\\byou(?:'re| are) (losing|burning|spending) ₹?\\s?[\\d,]+ (on|in) (ads|cac)"
  stages_with_private_data: ["audit", "build", "retainer"]
  daily_cap_per_inbox: 30
  # per sender account per day; conservative defaults, well under platform limits — set yours
  daily_cap_per_channel: {inmail: 20, linkedin_connect: 20, linkedin_dm: 30, instagram_dm: 20, whatsapp: 50, sms: 50}
  stop_bounce_rate: 0.02
  warn_spam_complaint_rate: 0.001     # Gmail: keep under 0.1%
  stop_spam_complaint_rate: 0.003     # Gmail: never reach 0.3%
  dmarc_allowed_policies: [none, quarantine, reject]   # p=none is enough for Gmail/Outlook bulk rules; alignment is what matters
  sender_auth_required: ["spf", "dkim", "dmarc"]
  excluded_categories: []         # your ICP exclusions, e.g. ["trading", "real estate"]

automation:
  dedupe_window_hours: 24
  max_per_contact_per_7d: {email: 3, whatsapp: 2, sms: 1}
  # Promotional sends blocked in this window; transactional/service messages are exempt.
  # 10:00 is a deliberately cautious end: some sources give 09:00 — set yours after checking TRAI's current text.
  quiet_hours_ist: {start: "21:00", end: "10:00"}
  promotional_types: ["promo", "winback", "abandoned_cart", "launch"]
  max_audience_growth_factor: 3.0
  reply_agent_allowed_actions: ["answer_faq", "share_link", "book_call", "escalate"]
  escalate_keywords: ["refund", "discount", "% off", "percent off", "money back", "chargeback", "paise wapas", "paisa wapas", "paise vapas",
                      "legal", "lawyer", "complaint", "consumer court", "allergy", "side effect", "reaction", "hospital"]
  # Allowlist: an inbound message may get an automatic reply ONLY if it matches one of these.
  # Everything else goes to a human. Safer than a keyword blocklist, which misses new phrasings.
  reply_auto_ok_patterns:
    - "\\bwhere (can|do) i (buy|get|find)\\b"
    - "\\bwhere is my order\\b"
    - "\\b(track|tracking)\\b"
    - "\\border status\\b"
    - "\\b(price|cost|how much)\\b"
    - "\\b(delivery|shipping) (time|charges?|date)\\b"
    - "\\bingredients?\\b"
    - "\\b(store|shop) (hours|timings?|location)\\b"
  offer_words: ["% off", "percent off", "discount", "coupon", "use code", "sale", "offer", "cashback"]

action_gate:
  tiers:
    R0: {checks: false, evaluator: false, human: false, canary: false}
    R1: {checks: true,  evaluator: false, human: false, canary: false}
    R2: {checks: true,  evaluator: true,  human: false, canary: false}
    R3: {checks: true,  evaluator: true,  human: true,  canary: true}
  action_tiers:
    draft: R0
    recon_note: R0
    crm_update: R1
    score_lead: R1
    report_draft: R1
    send_single: R2
    reply_single: R2
    send_bulk: R3
    activate_flow: R3
    publish: R3
    client_crm_bulk_write: R3
  kill_switch_env: "GTM_EVALS_KILL_SWITCH"
  max_regenerations: 2
  max_tokens_per_run: 200000

ai_seo:   # technical AI SEO (ContentOS E1/E2). Crawler names change: check each vendor's crawler docs.
  # Must be allowed, or the brand can't appear in that assistant's search answers / live fetches.
  # Search/answer crawlers: must be allowed, or the brand drops out of that engine's answers.
  answer_crawlers: [OAI-SearchBot, Claude-SearchBot, PerplexityBot, Googlebot, Bingbot]
  # Fetch only when a user asks; vendors say robots.txt may not apply to them. Blocking them in robots.txt is
  # reported, not failed: whether they get through is decided by the firewall/CDN, so test that instead.
  user_triggered_fetchers: [ChatGPT-User, Claude-User, Perplexity-User, Google-Agent]
  # Model training. The client's choice: reported by `training_access()`, never failed.
  training_crawlers: [GPTBot, ClaudeBot, Google-Extended, Applebot-Extended, CCBot, meta-externalagent]
  # Training tokens that also affect visibility: blocking Google-Extended can cut Gemini grounding (not Google Search).
  visibility_relevant_training: [Google-Extended]
  min_words_without_js: 120        # visible words a no-JavaScript crawler must find on a key page
  require_canonical: true
  required_schema_types: [Organization]
  schema_required_fields:          # "a|b" = either field
    Organization: [name, url, "logo|image", sameAs]
    Person: [name, "jobTitle|worksFor", sameAs]
    Product: [name, "brand|manufacturer", "offers|aggregateRating|review", "image"]
    FAQPage: [mainEntity]
    Article: [headline, "author", datePublished]
  description_min_overlap: 0.6     # share of the canonical one-liner's words each channel's description must use

visibility:
  query_types: ["brand", "niche", "best_x"]
  min_runs_per_prompt: 2
  z: 1.96

evals:
  min_recall_must_block: 0.95
  min_precision: 0.80

manipulation:   # ethics: escalated for a human to verify, never auto-sent
  patterns:
    - "\\bonly \\d+ (left|spots?|slots?|seats?)\\b"
    - "\\b(last|final) chance\\b"
    - "\\b(ends|expires|closing) (tonight|today|in \\d+ (hours?|minutes?))\\b"
    - "\\b(everyone|all your competitors) (is|are) (already )?(using|doing)\\b"
    - "\\byou('ll| will) (regret|lose everything|be left behind)\\b"
    - "\\bact (now|fast)\\b"

evidence:   # how much proof a DEPLOYABLE verdict needs (gtm_evals.evidence)
  confidence: 0.95
  default_rate: 0.5        # used when a manifest doesn't state its claim (the conservative choice)
  default_margin: 0.10     # ±10% → 97 real cases at rate 0.5, 35 at a stated 0.9
  strata: {standard: 0.40, ambiguous: 0.35, adversarial: 0.25}
  require_two_labellers: true
  min_kappa: 0.80

deployment_gate:
  lanes:                     # guards every workflow in a lane must wire in
    content_ops:          [claims_gate, promise_guard, manipulation_guard, claim_safety_guard, pii_guard, injection_guard]
    ai_seo:               [ai_seo_guard, visibility_stats, promise_guard]
    gtm_engineering:      [outreach_guard, promise_guard, pii_guard, injection_guard, manipulation_guard, dpdp_guard]
    marketing_automation: [automation_guard, pii_guard, injection_guard, manipulation_guard, dpdp_guard]
  lane_aliases: {ai_visibility: ai_seo}   # old name, still accepted
  min_real_golden_cases: 30  # needed before 'deployed'; fewer = pilot only
  judge_min_labels: 30
  judge_min_agreement: 0.85
  min_log_retention_days: 90
  # Never collected or stored by a workflow (DPDP minimisation; Clyve memory rules)
  forbidden_data_fields: [aadhaar, pan, passport, bank_account, card_number, religion, caste, health, sexual_orientation, political_view]
  # Never used to score, rank or target people (fairness)
  protected_attributes: [gender, age, religion, caste, ethnicity, race, disability, marital_status, sexual_orientation, pregnancy]
