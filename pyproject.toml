[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gtm-evals"
version = "0.1.1"
description = "Evals and guardrails for AI GTM engineering: content ops, AI visibility, outbound and marketing automation. Deployable, safe, ethical."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Akul S. Malhotra", email = "46711937+Akulm26@users.noreply.github.com" }]
maintainers = [{ name = "Akul S. Malhotra (@Akulm26)" }]
keywords = ["llm", "evals", "guardrails", "gtm", "outbound", "marketing-automation", "ai-safety", "aeo", "geo", "dpdp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Communications :: Email",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
judges = ["anthropic>=0.40"]
dev = ["pytest>=8", "openpyxl"]

[project.scripts]
gtm-evals = "gtm_evals.cli:main"

[project.urls]
Homepage = "https://github.com/Akulm26/clyve-evals-guardrails"
Issues = "https://github.com/Akulm26/clyve-evals-guardrails/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_evals"]

[tool.hatch.build.targets.sdist]
include = ["src/gtm_evals", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
