# Clyve's own teardown outreach (scope ladder step 1: dogfood).
name: Clyve teardown outreach
owner: Akul
lane: gtm_engineering
status: pilot
actions: [score_lead, crm_update, send_single, send_bulk]
guards: [outreach_guard, promise_guard, pii_guard, injection_guard, manipulation_guard, claims_gate, enrichment_guard, dpdp_guard, output_guard, provenance]
judges:
  - template: personalisation_factuality
    labels: evals/labels/personalisation_factuality.csv   # filled from the labelling sheet
    calibration: {labelled_cases: 0, agreement: 0}     # Q3 not done yet
claims: {precision: 0.90, margin: 0.10}   # what this workflow claims; the gate sizes the proof from it (35 real cases)
golden_set: evals/datasets/outreach_messages.jsonl
human_approver: Akul
canary_percent: 5
rollout:                         # live proof: 7 clean days in shadow, 7 in canary, then segment (policy defaults)
  log: logs/decisions.jsonl      # one row per lead handled; written by the n8n flow (docs/15-rollout.md)
budgets: {usd_per_item: 0.25, p95_seconds: 90}
incident:
  playbook: docs/16-incident-playbook.md
  last_drill: null               # run the kill-switch drill and put the date here
  breach_report_hours: 72        # DPDP Rule 7: detailed report to the Board within 72 hours
kill_switch: CLYVE_KILL_SWITCH
token_budget: 200000
logging: {gate_log: true, retention_days: 365}
data:
  personal_data: true
  fields: [name, work_email, company, role, linkedin_url]
  lawful_basis_field: true
  consent_checked_at_send: true
  opt_out_hours: 0
scoring_features: [category, price_band, active_meta_ads, ai_answer_absence, city]
