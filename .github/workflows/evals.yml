name: ci
on: [push, pull_request]
jobs:
  unit:                                # one module at a time; fast; every supported Python
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -m unit -q

  integration:                         # modules together, CLI in-process, real files; coverage gate on unit + integration
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -m "unit or integration" -q --cov=gtm_evals --cov-report=term-missing --cov-fail-under=95
      - run: python evals/run_evals.py
      - run: python sim/fuzz.py --strict
      - run: python sim/pipeline.py
      - run: gtm-evals gate workflows/*.yaml
      - run: python sim/holdout.py      # reported, not gating: held-out misses are documented gaps

  system:                              # the built wheel in a fresh venv, plus the container image
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -m system -v -rs

  action-self-test:                    # the repo's own GitHub Action, used the way others will use it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: { command: gate, args: "workflows/*.yaml" }
      - uses: ./
        with: { command: eval, args: "src/gtm_evals/data/templates/evals/golden.jsonl" }
